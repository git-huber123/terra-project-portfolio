    <script>
      function findIntersection(rect, uX, uY, uZ) {
        const xFace = player.x < rect[4] ? rect[4] : rect[3]; // since rect[3] is min x and rect[4] is max x
        const yFace = player.y < rect[6] ? rect[6] : rect[5]; // repeat
        const zFace = player.z < rect[8] ? rect[8] : rect[7];

        const xT = (xFace - player.x) / uX;
        const yT = (yFace - player.y) / uY;
        const zT = (zFace - player.z) / uZ;

        const maxX = rect[3];
        const minX = rect[4];
        const maxY = rect[5];
        const minY = rect[6];
        const maxZ = rect[7];
        const minZ = rect[8];

        let t = Infinity;

        if (xT > 0 && xT < t) {
          const xPredy = player.y + uY * xT;
          const xPredz = player.z + uZ * xT;
          if (xPredy >= minY && xPredy <= maxY && xPredz >= minZ && xPredz <= maxZ) {
            t = xT;
          }
        }
        if (yT > 0 && yT < t) {
          const yPredx = player.x + uX * yT;
          const yPredz = player.z + uZ * yT;
          if (yPredx >= minX && yPredx <= maxX && yPredz >= minZ && yPredz <= maxZ) {
            t = yT;
          }
        }
        if (zT > 0 && zT < t) {
          const zPredy = player.y + uY * zT;
          const zPredx = player.x + uX * zT;
          if (zPredx >= minX && zPredx <= maxX && zPredy >= minY && zPredy <= maxY) {
            t = zT;
          }
        }

        return t;
      }

      function drawRect(x, y, width, height, fillColor = "black", strokeColor = null, lineWidth = 1) {
        if (fillColor !== null) {
          ctx.fillStyle = fillColor;
          ctx.fillRect(x, y, width, height);
        }

        if (strokeColor !== null) {
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = lineWidth;
          ctx.strokeRect(x, y, width, height);
        }
      }

      function tileHue(x, y) {
        let n = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
        n = Math.imul(n ^ (n >>> 13), 1274126177);
        n ^= n >>> 16;
        return (n >>> 0) % 360;
      }

      function updateBody() {
        const base = player.z - 1.5; // feet height, so the body follows jumps and falls
        const px = player.x;
        const py = player.y;

        const set = (rect, x0, y0, z0, x1, y1, z1) => {
          rect[0].x = x0;
          rect[0].y = y0;
          rect[0].z = z0;
          rect[1].x = x1;
          rect[1].y = y1;
          rect[1].z = z1;
        };

        // legs: 0.5 x 0.5, z 0 to 0.65, 0.25 gap between them
        set(rects[bodyStart], px - 0.25, py - 0.625, base, px + 0.25, py - 0.125, base + 0.65);
        set(rects[bodyStart + 1], px - 0.25, py + 0.125, base, px + 0.25, py + 0.625, base + 0.65);

        // torso: 0.5 x 1.25, z 0.65 to 1.3
        set(rects[bodyStart + 2], px - 0.25, py - 0.625, base + 0.65, px + 0.25, py + 0.625, base + 1.3);
      }

      function updateVertical() {
        touchingFloor = false;

        player.velocity -= gravity;
        player.z += player.velocity;

        // 1. the z = 0 ground plane (not a rect)
        if (player.z - feetOffset < 0) {
          player.z = feetOffset;
          player.velocity = 0;
          touchingFloor = true;
        }

        // 2. boxes
        if (checkCollisions()) {
          if (player.velocity <= 0) {
            // moving down: landed on something. Snap feet to the top of the box we're inside.
            const feet = player.z - feetOffset;
            let top = -Infinity;
            for (let i = 0; i < rects.length; i++) {
              // use bodyStart instead of rects.length once the body is back
              const r = rects[i];
              if (areTouching(playerBox(), r)) {
                top = Math.max(top, Math.max(r[0].z, r[1].z));
              }
            }
            player.z = top + feetOffset + 0.0001; // tiny gap so resting doesn't count as overlap
            touchingFloor = true;
          } else {
            // moving up: hit a ceiling. Back out and start falling.
            player.z -= player.velocity;
          }
          player.velocity = 0;
        }
      }

      function makeBoxes(count, seed) {
        let s = seed;
        const rand = () => {
          s |= 0;
          s = (s + 0x6d2b79f5) | 0;
          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const between = (a, b) => Math.floor(a + rand() * (b - a + 1));

        const boxes = [];
        while (boxes.length < count) {
          const x = between(-30, 30),
            y = between(-30, 30),
            z = between(0, 14);
          const dx = between(1, 6),
            dy = between(1, 6),
            dz = between(1, 8);
          if (Math.abs(x) < 3 && Math.abs(y) < 3) continue; // keep the spawn clear
          boxes.push([
            { x, y, z },
            { x: x + dx, y: y + dy, z: z + dz },
            { h: between(0, 360), s: between(50, 90), l: between(40, 70) },
          ]);
        }
        return boxes;
      }

      function placeBlock() {
        const th = (player.xCenterAngle * Math.PI) / 180;
        const ph = (player.yCenterAngle * Math.PI) / 180;
        targetRect = null;

        const fwd = { x: Math.cos(th) * Math.cos(ph), y: Math.sin(th) * Math.cos(ph), z: -Math.sin(ph) };

        const uX = fwd.x;
        const uY = fwd.y;
        const uZ = fwd.z;
        let t = Infinity;

        // only set when that axis wins, so they stay undefined otherwise
        let xFace, yFace, zFace, xT, yT, zT, minX, minY, minZ;

        for (const rect of rects) {
          const rxFace = player.x < rect[4] ? rect[4] : rect[3];
          const ryFace = player.y < rect[6] ? rect[6] : rect[5];
          const rzFace = player.z < rect[8] ? rect[8] : rect[7];

          const rxT = (rxFace - player.x) / uX;
          const ryT = (ryFace - player.y) / uY;
          const rzT = (rzFace - player.z) / uZ;

          const rMaxX = rect[3];
          const rMinX = rect[4];
          const rMaxY = rect[5];
          const rMinY = rect[6];
          const rMaxZ = rect[7];
          const rMinZ = rect[8];

          if (rxT > 0 && rxT < t) {
            const xPredy = player.y + uY * rxT;
            const xPredz = player.z + uZ * rxT;
            if (xPredy >= rMinY && xPredy <= rMaxY && xPredz >= rMinZ && xPredz <= rMaxZ) {
              t = rxT;
              xT = rxT;
              xFace = rxFace;
              minX = rMinX;
              targetRect = rect;
            }
          }
          if (ryT > 0 && ryT < t) {
            const yPredx = player.x + uX * ryT;
            const yPredz = player.z + uZ * ryT;
            if (yPredx >= rMinX && yPredx <= rMaxX && yPredz >= rMinZ && yPredz <= rMaxZ) {
              t = ryT;
              yT = ryT;
              yFace = ryFace;
              minY = rMinY;
              targetRect = rect;
            }
          }
          if (rzT > 0 && rzT < t) {
            const zPredy = player.y + uY * rzT;
            const zPredx = player.x + uX * rzT;
            if (zPredx >= rMinX && zPredx <= rMaxX && zPredy >= rMinY && zPredy <= rMaxY) {
              t = rzT;
              zT = rzT;
              zFace = rzFace;
              minZ = rMinZ;
              targetRect = rect;
            }
          }
        }

        let corner1, corner2;

        let point = { x: player.x + uX * t, y: player.y + uY * t, z: player.z + uZ * t };

        if (xT === t) {
          point.x -= xFace === minX ? 1 : -1;
          point.y = Math.floor(point.y);
          point.z = Math.floor(point.z);
          corner1 = structuredClone(point);
          point.y += 1;
          point.z += 1;
          point.x = xFace;
          corner2 = structuredClone(point);
        } else if (yT === t) {
          point.y -= yFace === minY ? 1 : -1;
          point.x = Math.floor(point.x);
          point.z = Math.floor(point.z);
          corner1 = structuredClone(point);
          point.x += 1;
          point.z += 1;
          point.y = yFace;
          corner2 = structuredClone(point);
        } else if (zT === t) {
          point.z -= zFace === minZ ? 1 : -1;
          point.y = Math.floor(point.y);
          point.x = Math.floor(point.x);
          corner1 = structuredClone(point);
          point.y += 1;
          point.x += 1;
          point.z = zFace;
          corner2 = structuredClone(point);
        } else if (t === Infinity && uZ < 0) {
          t = -player.z / uZ;
          point = { x: Math.floor(player.x + uX * t), y: Math.floor(player.y + uY * t), z: 0 };
          corner1 = structuredClone(point);
          point.x += 1;
          point.y += 1;
          point.z = 1;
          corner2 = structuredClone(point);
        }

        if (t > reach) targetRect = null;

        if (t === Infinity || t > reach) return;

        const r = [corner1, corner2, { h: Math.random() * 360, s: 100, l: 50 }];
        r[3] = Math.max(r[0].x, r[1].x);
        r[4] = Math.min(r[0].x, r[1].x);
        r[5] = Math.max(r[0].y, r[1].y);
        r[6] = Math.min(r[0].y, r[1].y);
        r[7] = Math.max(r[0].z, r[1].z);
        r[8] = Math.min(r[0].z, r[1].z);
        if (areTouching(playerBox(), r)) return;
        return r;
      }

      const floorSize = 50;
      const floorColors = [];
      for (let i = 0; i < floorSize * 2; i++) {
        floorColors.push([]);
        for (let j = 0; j < floorSize * 2; j++) {
          floorColors[i].push({ h: Math.random() * 360, s: 60, l: 50 });
        }
      }

      const rects = [
        /*[
          { x: 3, y: 3, z: 0 },
          { x: 6, y: 6, z: 3 },
          { h: 0, s: 100, l: 50 },
        ], // original red box

        // stepping pillars, heading out along +x (the way you face at the start)
        [
          { x: 8, y: -1, z: 0 },
          { x: 10, y: 1, z: 1 },
          { h: 30, s: 80, l: 50 },
        ],
        [
          { x: 11.5, y: -1, z: 0 },
          { x: 13.5, y: 1, z: 2 },
          { h: 55, s: 80, l: 50 },
        ],
        [
          { x: 15.5, y: 0, z: 0 },
          { x: 17.5, y: 2, z: 3 },
          { h: 100, s: 70, l: 45 },
        ],
        [
          { x: 19.5, y: 2, z: 0 },
          { x: 21.5, y: 4, z: 4 },
          { h: 160, s: 70, l: 45 },
        ],
        [
          { x: 23, y: 4, z: 0 },
          { x: 25, y: 6, z: 5 },
          { h: 200, s: 75, l: 50 },
        ],

        // goal platform
        [
          { x: 27, y: 6, z: 0 },
          { x: 33, y: 12, z: 5 },
          { h: 280, s: 70, l: 50 },
        ],

        // test ceiling
        [
          { x: -5, y: -5, z: 5 },
          { x: -10, y: -10, z: 8 },
          { h: 60, s: 75, l: 50 },
        ],
        //*/
      ];

      //rects.push(...makeBoxes(100, 1));

      let totalDelay = 0;
      let delaysCounted = 0;

      /*const bodyStart = rects.length; // index of the first body part
            rects.push(
              [
                { x: 0, y: 0, z: 0 },
                { x: 0, y: 0, z: 0 },
                { h: 220, s: 70, l: 40 },
              ], // left leg
              [
                { x: 0, y: 0, z: 0 },
                { x: 0, y: 0, z: 0 },
                { h: 220, s: 70, l: 40 },
              ], // right leg
              [
                { x: 0, y: 0, z: 0 },
                { x: 0, y: 0, z: 0 },
                { h: 120, s: 60, l: 40 },
              ], // torso
            );*/

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      let avgMs = 0;

      canvas.width = 2500;
      canvas.height = 1250;

      const xDegs = 100;
      const yDegs = 50;
      const xScale = 0.2;
      const yScale = 0.2;
      const xCells = xDegs / xScale;
      const yCells = yDegs / yScale;

      const rayStep = 0.05;

      const reach = 15;

      let targetRect = null;

      const aMax = Math.tan((xDegs / 2) * (Math.PI / 180));
      const bMax = (aMax * canvas.height) / canvas.width;

      const gravity = 0.05;
      const jumpVelocity = 0.75;

      const width = canvas.width / (xDegs / xScale);
      const height = canvas.height / (yDegs / yScale);

      const viewDistance = 100;

      const player = { x: 0, y: 0, z: 1.5, xCenterAngle: 0, yCenterAngle: 0, velocity: 0 };

      let touchingFloor = true;

      const feetOffset = 1.5;

      const maxBoxZ = Math.max(...rects.flatMap((r) => [r[0].z, r[1].z]));
      const ts = new Float32Array(xCells * yCells);

      function areTouching(a, b) {
        const overlap = (a0, a1, b0, b1) => Math.min(a0, a1) < Math.max(b0, b1) && Math.max(a0, a1) > Math.min(b0, b1);

        return overlap(a[0].x, a[1].x, b[0].x, b[1].x) && overlap(a[0].y, a[1].y, b[0].y, b[1].y) && overlap(a[0].z, a[1].z, b[0].z, b[1].z);
      }

      function checkCollisions() {
        const half = 0.25; // player half-width in x and y
        const me = playerBox();

        // when you re-enable the body, replace rects.length with bodyStart
        // so the player doesn't collide with their own body
        const solidCount = rects.length;

        for (let i = 0; i < solidCount; i++) {
          if (areTouching(me, rects[i])) return true;
        }
        return false;
      }

      function playerBox() {
        const half = 0.25;
        return [
          { x: player.x - half, y: player.y - half, z: player.z - feetOffset },
          { x: player.x + half, y: player.y + half, z: player.z + 0.2 },
        ];
      }

      let wantBreak = false;
      let wantPlace = false;

      window.addEventListener("mousedown", (e) => {
        if (document.pointerLockElement !== canvas) return; // the first click only grabs the mouse
        if (e.button === 0) wantBreak = true;
        if (e.button === 2) wantPlace = true;
      });

      const TREE_RADIUS = 50;

      const TRUNK = { h: 25, s: 50, l: 28 };
      const LEAF = { h: 115, s: 55, l: 32 };

      // [dx, dy, dz, color], relative to the root block
      // Your cross section, rotated around the vertical axis:
      // each layer's arms extend the same distance along x and y.
      const treeOffsets = [
        // trunk
        [0, 0, 0, TRUNK],
        [0, 0, 1, TRUNK],
        // widest layer (the "+++++" row): arms of length 2
        [0, 0, 2, LEAF],
        [1, 0, 2, LEAF],
        [2, 0, 2, LEAF],
        [-1, 0, 2, LEAF],
        [-2, 0, 2, LEAF],
        [0, 1, 2, LEAF],
        [0, 2, 2, LEAF],
        [0, -1, 2, LEAF],
        [0, -2, 2, LEAF],
        [1, 1, 2, LEAF],
        [1, -1, 2, LEAF],
        [-1, 1, 2, LEAF],
        [-1, -1, 2, LEAF],
        // middle layer ("_+++_"): arms of length 1
        [0, 0, 3, LEAF],
        [1, 0, 3, LEAF],
        [-1, 0, 3, LEAF],
        [0, 1, 3, LEAF],
        [0, -1, 3, LEAF],
        // top
        [0, 0, 4, LEAF],
      ];

      function spawnTree(rootX, rootY) {
        rootX = Math.floor(rootX);
        rootY = Math.floor(rootY);

        // root must be within 50 units of the player
        if (Math.hypot(rootX - player.x, rootY - player.y) > TREE_RADIUS) return false;

        const tree = [];
        for (const [dx, dy, dz, color] of treeOffsets) {
          const x = rootX + dx,
            y = rootY + dy,
            z = dz; // root sits on the ground at z = 0
          const r = [{ x, y, z }, { x: x + 1, y: y + 1, z: z + 1 }, { ...color }];
          r[3] = x + 1;
          r[4] = x;
          r[5] = y + 1;
          r[6] = y;
          r[7] = z + 1;
          r[8] = z;
          tree.push(r);
        }

        // don't plant a tree on top of the player
        if (tree.some((r) => areTouching(playerBox(), r))) return false;

        rects.push(...tree);
        return true;
      }

      // plant `count` trees at random spots around the player
      function spawnTrees(count) {
        for (let n = 0; n < count; n++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.sqrt(Math.random()) * TREE_RADIUS; // sqrt keeps them evenly spread instead of bunched at the center
          spawnTree(player.x + Math.cos(angle) * dist, player.y + Math.sin(angle) * dist);
          console.log("spawned");
        }
      }

      spawnTrees(Math.floor(Math.random() * 20) + 10);

      for (const rect of rects) {
        rect[3] = Math.max(rect[0].x, rect[1].x);
        rect[4] = Math.min(rect[0].x, rect[1].x);
        rect[5] = Math.max(rect[0].y, rect[1].y);
        rect[6] = Math.min(rect[0].y, rect[1].y);
        rect[7] = Math.max(rect[0].z, rect[1].z);
        rect[8] = Math.min(rect[0].z, rect[1].z);
      }

      function handleInput() {
        const h = (player.xCenterAngle * Math.PI) / 180;
        const fx = Math.cos(h); // forward vector
        const fy = Math.sin(h);
        const pitchLimit = 90 - yDegs / 2;

        if (wantPlace) {
          wantPlace = false;
          const block = placeBlock();
          if (block) rects.push(block);
        }

        if (keysDown.has("KeyW")) {
          player.x += fx * move;
          if (checkCollisions()) player.x -= fx * move;
          player.y += fy * move;
          if (checkCollisions()) player.y -= fy * move;
        }
        if (keysDown.has("KeyS")) {
          player.x -= fx * move;
          if (checkCollisions()) player.x += fx * move;
          player.y -= fy * move;
          if (checkCollisions()) player.y += fy * move;
        }
        if (keysDown.has("KeyD")) {
          player.x += fy * move;
          if (checkCollisions()) player.x -= fy * move;
          player.y -= fx * move;
          if (checkCollisions()) player.y += fx * move;
        } // right = (fy, -fx)
        if (keysDown.has("KeyA")) {
          player.x -= fy * move;
          if (checkCollisions()) player.x += fy * move;
          player.y += fx * move;
          if (checkCollisions()) player.y -= fx * move;
        }

        if (keysDown.has("Space") && touchingFloor) {
          player.velocity += jumpVelocity;
        }
        //if (keysDown.has("ShiftLeft") || keysDown.has("ShiftRight")) player.z -= move;

        if (keysDown.has("ArrowUp")) {
          player.yCenterAngle = Math.max(-pitchLimit, player.yCenterAngle - moveAngle);
        }
        if (keysDown.has("ArrowDown")) {
          player.yCenterAngle = Math.min(pitchLimit, player.yCenterAngle + moveAngle);
        }
        if (keysDown.has("ArrowLeft")) {
          player.xCenterAngle = (player.xCenterAngle + moveAngle) % 360;
        }
        if (keysDown.has("ArrowRight")) {
          player.xCenterAngle = (player.xCenterAngle - moveAngle + 360) % 360;
        }
      }

      const buf = document.createElement("canvas");
      buf.width = xDegs / xScale;
      buf.height = yDegs / yScale;
      const bufCtx = buf.getContext("2d");
      const img = bufCtx.createImageData(buf.width, buf.height);

      function hslToRgb(h, s, l) {
        s /= 100;
        l /= 100;
        const k = (n) => (n + h / 30) % 12;
        const a = s * Math.min(l, 1 - l);
        const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
        return [f(0) * 255, f(8) * 255, f(4) * 255];
      }

      function setPixel(i, j, h, s, l) {
        const [r, g, b] = hslToRgb(h, s, l);
        const p = (j * buf.width + i) * 4;
        img.data[p] = r;
        img.data[p + 1] = g;
        img.data[p + 2] = b;
        img.data[p + 3] = 255;
      }

      function loop() {
        function cellDir(i, j) {
          const a = (((i + 0.5) / xCells) * 2 - 1) * aMax;
          const b = (1 - ((j + 0.5) / yCells) * 2) * bMax;
          const dx = fwd.x + right.x * a + up.x * b;
          const dy = fwd.y + right.y * a + up.y * b;
          const dz = fwd.z + right.z * a + up.z * b;
          const len = Math.hypot(dx, dy, dz);
          return [dx / len, dy / len, dz / len];
        }

        const t0 = performance.now();
        handleInput();
        updateVertical();
        placeBlock();

        //updateBody();

        const th = (player.xCenterAngle * Math.PI) / 180;
        const ph = (player.yCenterAngle * Math.PI) / 180;

        const fwd = { x: Math.cos(th) * Math.cos(ph), y: Math.sin(th) * Math.cos(ph), z: -Math.sin(ph) };
        const right = { x: Math.sin(th), y: -Math.cos(th), z: 0 };
        const up = { x: Math.cos(th) * Math.sin(ph), y: Math.sin(th) * Math.sin(ph), z: Math.cos(ph) };

        img.data.fill(0);

        ts.fill(Infinity);

        for (let i = 0; i < xCells; i++) {
          for (let j = 0; j < yCells; j++) {
            const [uX, uY, uZ] = cellDir(i, j);
            if (uZ >= 0) continue;
            const ft = -player.z / uZ;
            if (ft >= viewDistance) continue;
            ts[j * xCells + i] = ft;
            const fade = (viewDistance - ft) / viewDistance;
            setPixel(i, j, tileHue(Math.floor(player.x + uX * ft), Math.floor(player.y + uY * ft)), 40, 30 * (0.25 + 0.75 * fade));
          }
        }

        const near = 0.05;
        const cv = new Float64Array(24); // corner offsets from the player
        const cd = new Float64Array(8); // corner depths along fwd

        // inside loop(), replacing your whole `for (const rect of rects)` block:
        for (const rect of rects) {
          let minA = Infinity,
            maxA = -Infinity,
            minB = Infinity,
            maxB = -Infinity;

          const addPoint = (vx, vy, vz, depth) => {
            const a = (vx * right.x + vy * right.y + vz * right.z) / depth;
            const b = (vx * up.x + vy * up.y + vz * up.z) / depth;
            if (a < minA) minA = a;
            if (a > maxA) maxA = a;
            if (b < minB) minB = b;
            if (b > maxB) maxB = b;
          };

          // the 8 corners: the 3 bits of c pick min or max on each axis
          for (let c = 0; c < 8; c++) {
            const vx = (c & 1 ? rect[3] : rect[4]) - player.x;
            const vy = (c & 2 ? rect[5] : rect[6]) - player.y;
            const vz = (c & 4 ? rect[7] : rect[8]) - player.z;
            const depth = vx * fwd.x + vy * fwd.y + vz * fwd.z;

            cv[c * 3] = vx;
            cv[c * 3 + 1] = vy;
            cv[c * 3 + 2] = vz;
            cd[c] = depth;

            if (depth > near) addPoint(vx, vy, vz, depth);
          }

          // the 12 edges: each corner paired with the corner that differs in one bit.
          // If one end is in front of the near plane and the other isn't, project the crossing point.
          for (let c = 0; c < 8; c++) {
            for (let bit = 1; bit <= 4; bit <<= 1) {
              if (c & bit) continue; // visit each edge once, from its lower corner
              const d = c | bit;
              if (cd[c] > near !== cd[d] > near) {
                const k = (cd[c] - near) / (cd[c] - cd[d]); // how far along the edge it crosses
                addPoint(
                  cv[c * 3] + (cv[d * 3] - cv[c * 3]) * k,
                  cv[c * 3 + 1] + (cv[d * 3 + 1] - cv[c * 3 + 1]) * k,
                  cv[c * 3 + 2] + (cv[d * 3 + 2] - cv[c * 3 + 2]) * k,
                  near,
                );
              }
            }
          }

          if (minA === Infinity) continue; // nothing in front of you at all

          // a is in [-aMax, aMax]: shift to [0, 2aMax], divide to get 0..1, scale to cells
          let minI = Math.floor(((minA + aMax) / (2 * aMax)) * xCells);
          let maxI = Math.floor(((maxA + aMax) / (2 * aMax)) * xCells);
          // b is flipped (up is positive, rows go down), so max b is the smallest j
          let minJ = Math.floor(((bMax - maxB) / (2 * bMax)) * yCells);
          let maxJ = Math.floor(((bMax - minB) / (2 * bMax)) * yCells);

          if (maxI < 0 || minI >= xCells || maxJ < 0 || minJ >= yCells) continue; // off-screen
          minI = Math.max(0, minI);
          maxI = Math.min(xCells - 1, maxI);
          minJ = Math.max(0, minJ);
          maxJ = Math.min(yCells - 1, maxJ);

          for (let i = minI; i <= maxI; i++) {
            for (let j = minJ; j <= maxJ; j++) {
              const [uX, uY, uZ] = cellDir(i, j);
              const t = findIntersection(rect, uX, uY, uZ);
              const idx = j * xCells + i;
              if (t < ts[idx] && t < viewDistance) {
                ts[idx] = t;
                const fade = (viewDistance - t) / viewDistance;
                let h = rect[2].h,
                  s = rect[2].s,
                  l = rect[2].l * (0.25 + 0.75 * fade);

                if (rect === targetRect) {
                  const px = player.x + uX * t,
                    py = player.y + uY * t,
                    pz = player.z + uZ * t;
                  const eps = 0.015 + t * 0.004; // grows with distance so the line has a steady on-screen thickness
                  let near = 0;
                  if (Math.abs(px - rect[3]) < eps || Math.abs(px - rect[4]) < eps) near++;
                  if (Math.abs(py - rect[5]) < eps || Math.abs(py - rect[6]) < eps) near++;
                  if (Math.abs(pz - rect[7]) < eps || Math.abs(pz - rect[8]) < eps) near++;
                  if (near >= 2) {
                    s = 0;
                    l = 95;
                  } // dark outline; use l = 95 for white
                }

                setPixel(i, j, h, s, l);
              }
            }
          }
        }
        bufCtx.putImageData(img, 0, 0);
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = false; // keep the blocky look instead of blurring
        ctx.drawImage(buf, 0, 0, canvas.width, canvas.height);
        const frameMs = performance.now() - t0;
        avgMs = avgMs * 0.9 + frameMs * 0.1;
        const stat = JSON.stringify(player) + " MS per Frame: " + Number(avgMs);

        if (document.getElementById("stats").textContent !== stat) document.getElementById("stats").textContent = stat;
        setTimeout(() => {
          requestAnimationFrame(loop);
        }, 0);
      }

      const keysDown = new Set();
      const trackedKeys = new Set(["KeyW", "KeyA", "KeyS", "KeyD", "ShiftLeft", "ShiftRight", "Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"]);

      const move = 0.15;

      const moveAngle = 1;

      window.addEventListener("keydown", (event) => {
        if (!trackedKeys.has(event.code)) return;

        event.preventDefault(); // Stops arrows/space from scrolling the page
        keysDown.add(event.code);
      });

      window.addEventListener("keyup", (event) => {
        keysDown.delete(event.code);
      });

      const mouseSensitivity = 0.08; // degrees per pixel of mouse movement

      canvas.addEventListener("click", () => {
        canvas.requestPointerLock();
      });

      window.addEventListener("mousemove", (event) => {
        if (document.pointerLockElement !== canvas) return;

        const pitchLimit = 90; // - yDegs / 2; // keep this the same as in handleInput

        // mouse right -> turn right (angle goes down, matching your ArrowRight)
        player.xCenterAngle = (((player.xCenterAngle - event.movementX * mouseSensitivity) % 360) + 360) % 360;

        // mouse down -> look down (positive pitch is down, matching your ArrowDown)
        player.yCenterAngle = Math.max(-pitchLimit, Math.min(pitchLimit, player.yCenterAngle + event.movementY * mouseSensitivity));
      });

      requestAnimationFrame(loop);
    </script>
  </body>
</html>
