      function findIntersection(rect, uX, uY, uZ, iX, iY, iZ) {
        const xFace = player.x < rect[4] ? rect[4] : rect[3]; // since rect[3] is min x and rect[4] is max x
        const yFace = player.y < rect[6] ? rect[6] : rect[5]; // repeat
        const zFace = player.z < rect[8] ? rect[8] : rect[7];

        const xT = (xFace - player.x) * iX;
        const yT = (yFace - player.y) * iY;
        const zT = (zFace - player.z) * iZ;

        const maxX = rect[3];
        const minX = rect[4];
        const maxY = rect[5];
        const minY = rect[6];
        const maxZ = rect[7];
        const minZ = rect[8];

        let t = Infinity;

        if (xT > 0 && xT < t) {
          const xPredy = player.y + uY * xT;
          const xPredz = player.z + uZ * xT;
          if (xPredy >= minY && xPredy <= maxY && xPredz >= minZ && xPredz <= maxZ) {
            t = xT;
          }
        }
        if (yT > 0 && yT < t) {
          const yPredx = player.x + uX * yT;
          const yPredz = player.z + uZ * yT;
          if (yPredx >= minX && yPredx <= maxX && yPredz >= minZ && yPredz <= maxZ) {
            t = yT;
          }
        }
        if (zT > 0 && zT < t) {
          const zPredy = player.y + uY * zT;
          const zPredx = player.x + uX * zT;
          if (zPredx >= minX && zPredx <= maxX && zPredy >= minY && zPredy <= maxY) {
            t = zT;
          }
        }

        return t;
      }

      function drawRect(x, y, width, height, fillColor = "black", strokeColor = null, lineWidth = 1) {
        if (fillColor !== null) {
          ctx.fillStyle = fillColor;
          ctx.fillRect(x, y, width, height);
        }

        if (strokeColor !== null) {
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = lineWidth;
          ctx.strokeRect(x, y, width, height);
        }
      }

      function tileHue(x, y) {
        let n = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
        n = Math.imul(n ^ (n >>> 13), 1274126177);
        n ^= n >>> 16;
        return (n >>> 0) % 360;
      }

      function updateBody() {
        const base = player.z - 1.5; // feet height, so the body follows jumps and falls
        const px = player.x;
        const py = player.y;

        const set = (rect, x0, y0, z0, x1, y1, z1) => {
          rect[0].x = x0;
          rect[0].y = y0;
          rect[0].z = z0;
          rect[1].x = x1;
          rect[1].y = y1;
          rect[1].z = z1;
        };

        // legs: 0.5 x 0.5, z 0 to 0.65, 0.25 gap between them
        set(rects[bodyStart], px - 0.25, py - 0.625, base, px + 0.25, py - 0.125, base + 0.65);
        set(rects[bodyStart + 1], px - 0.25, py + 0.125, base, px + 0.25, py + 0.625, base + 0.65);

        // torso: 0.5 x 1.25, z 0.65 to 1.3
        set(rects[bodyStart + 2], px - 0.25, py - 0.625, base + 0.65, px + 0.25, py + 0.625, base + 1.3);
      }

      function updateVertical(dT) {
        touchingFloor = false;

        const REF_MS = 20;
        const dt = Math.min(dT / REF_MS, 3);
        player.z += player.velocity * dt - 0.5 * gravity * dt * dt;
        player.velocity -= gravity * dt;

        // 1. the z = 0 ground plane (not a rect)
        if (player.z - feetOffset < 0) {
          player.z = feetOffset;
          player.velocity = 0;
          touchingFloor = true;
        }

        // 2. boxes
        if (checkCollisions()) {
          if (player.velocity <= 0) {
            // moving down: landed on something. Snap feet to the top of the box we're inside.
            const feet = player.z - feetOffset;
            let top = -Infinity;
            for (let i = 0; i < rects.length; i++) {
              // use bodyStart instead of rects.length once the body is back
              const r = rects[i];
              if (areTouching(playerBox(), r)) {
                top = Math.max(top, Math.max(r[0].z, r[1].z));
              }
            }
            player.z = top + feetOffset + 0.0001; // tiny gap so resting doesn't count as overlap
            touchingFloor = true;
          } else {
            // moving up: hit a ceiling. Back out and start falling.
            player.z -= player.velocity;
          }
          player.velocity = 0;
        }
      }

      function makeBoxes(count, seed) {
        let s = seed;
        const rand = () => {
          s |= 0;
          s = (s + 0x6d2b79f5) | 0;
          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        const between = (a, b) => Math.floor(a + rand() * (b - a + 1));

        const boxes = [];
        while (boxes.length < count) {
          const x = between(-30, 30),
            y = between(-30, 30),
            z = between(0, 14);
          const dx = between(1, 6),
            dy = between(1, 6),
            dz = between(1, 8);
          if (Math.abs(x) < 3 && Math.abs(y) < 3) continue; // keep the spawn clear
          boxes.push([
            { x, y, z },
            { x: x + dx, y: y + dy, z: z + dz },
            { h: between(0, 360), s: between(50, 90), l: between(40, 70) },
          ]);
        }
        return boxes;
      }

      function placeBlock() {
        const th = (player.xCenterAngle * Math.PI) / 180;
        const ph = (player.yCenterAngle * Math.PI) / 180;
        targetRect = null;

        const fwd = { x: Math.cos(th) * Math.cos(ph), y: Math.sin(th) * Math.cos(ph), z: -Math.sin(ph) };

        const uX = fwd.x;
        const uY = fwd.y;
        const uZ = fwd.z;
        let t = Infinity;

        // only set when that axis wins, so they stay undefined otherwise
        let xFace, yFace, zFace, xT, yT, zT, minX, minY, minZ;

        for (const rect of rects) {
          const rxFace = player.x < rect[4] ? rect[4] : rect[3];
          const ryFace = player.y < rect[6] ? rect[6] : rect[5];
          const rzFace = player.z < rect[8] ? rect[8] : rect[7];

          const rxT = (rxFace - player.x) / uX;
          const ryT = (ryFace - player.y) / uY;
          const rzT = (rzFace - player.z) / uZ;

          const rMaxX = rect[3];
          const rMinX = rect[4];
          const rMaxY = rect[5];
          const rMinY = rect[6];
          const rMaxZ = rect[7];
          const rMinZ = rect[8];

          if (rxT > 0 && rxT < t) {
            const xPredy = player.y + uY * rxT;
            const xPredz = player.z + uZ * rxT;
            if (xPredy >= rMinY && xPredy <= rMaxY && xPredz >= rMinZ && xPredz <= rMaxZ) {
              t = rxT;
              xT = rxT;
              xFace = rxFace;
              minX = rMinX;
              targetRect = rect;
            }
          }
          if (ryT > 0 && ryT < t) {
            const yPredx = player.x + uX * ryT;
            const yPredz = player.z + uZ * ryT;
            if (yPredx >= rMinX && yPredx <= rMaxX && yPredz >= rMinZ && yPredz <= rMaxZ) {
              t = ryT;
              yT = ryT;
              yFace = ryFace;
              minY = rMinY;
              targetRect = rect;
            }
          }
          if (rzT > 0 && rzT < t) {
            const zPredy = player.y + uY * rzT;
            const zPredx = player.x + uX * rzT;
            if (zPredx >= rMinX && zPredx <= rMaxX && zPredy >= rMinY && zPredy <= rMaxY) {
              t = rzT;
              zT = rzT;
              zFace = rzFace;
              minZ = rMinZ;
              targetRect = rect;
            }
          }
        }

        let corner1, corner2;

        let point = { x: player.x + uX * t, y: player.y + uY * t, z: player.z + uZ * t };

        if (xT === t) {
          point.x -= xFace === minX ? 1 : -1;
          point.y = Math.floor(point.y);
          point.z = Math.floor(point.z);
          corner1 = structuredClone(point);
          point.y += 1;
          point.z += 1;
          point.x = xFace;
          corner2 = structuredClone(point);
        } else if (yT === t) {
          point.y -= yFace === minY ? 1 : -1;
          point.x = Math.floor(point.x);
          point.z = Math.floor(point.z);
          corner1 = structuredClone(point);
          point.x += 1;
          point.z += 1;
          point.y = yFace;
          corner2 = structuredClone(point);
        } else if (zT === t) {
          point.z -= zFace === minZ ? 1 : -1;
          point.y = Math.floor(point.y);
          point.x = Math.floor(point.x);
          corner1 = structuredClone(point);
          point.y += 1;
          point.x += 1;
          point.z = zFace;
          corner2 = structuredClone(point);
        } else if (t === Infinity && uZ < 0) {
          t = -player.z / uZ;
          point = { x: Math.floor(player.x + uX * t), y: Math.floor(player.y + uY * t), z: 0 };
          corner1 = structuredClone(point);
          point.x += 1;
          point.y += 1;
          point.z = 1;
          corner2 = structuredClone(point);
        }

        if (t > reach) targetRect = null;

        if (t === Infinity || t > reach) return;

        const r = [corner1, corner2, { h: Math.random() * 360, s: 100, l: 50 }];
        r[3] = Math.max(r[0].x, r[1].x);
        r[4] = Math.min(r[0].x, r[1].x);
        r[5] = Math.max(r[0].y, r[1].y);
        r[6] = Math.min(r[0].y, r[1].y);
        r[7] = Math.max(r[0].z, r[1].z);
        r[8] = Math.min(r[0].z, r[1].z);
        if (areTouching(playerBox(), r)) return;
        return r;
      }

      function areEqual(obj1, obj2) {
        const keys1 = Object.keys(obj1);
        const keys2 = Object.keys(obj2);

        if (keys1.length !== keys2.length) return false;

        return keys1.every((key) => obj1[key] === obj2[key]);
      }

      function spawnEnemies(count, stats = null) {
        for (let i = 0; i < count; i++) {
          const s = stats ? stats[i] : { damage: 2, speed: 0.005 };
          const startX = Math.floor(Math.random() * enemyRadius * 2) - enemyRadius;
          const startY = Math.floor(Math.random() * enemyRadius * 2) - enemyRadius;
          makeEnemy({ x: startX, y: startY, z: 0 }, { x: startX + 1, y: startY + 1, z: 2 }, { h: 180, s: 100, l: 50 }, s);
        }
      }

      function makeEnemy(pos1, pos2, color, stats) {
        const obj = [pos1, pos2, color];
        obj[3] = Math.max(obj[0].x, obj[1].x);
        obj[4] = Math.min(obj[0].x, obj[1].x);
        obj[5] = Math.max(obj[0].y, obj[1].y);
        obj[6] = Math.min(obj[0].y, obj[1].y);
        obj[7] = Math.max(obj[0].z, obj[1].z);
        obj[8] = Math.min(obj[0].z, obj[1].z);
        obj[10] = true; // Is enemy?
        obj[11] = stats;
        enemies.push(obj);
        console.log("enemy");
      }

      function msg(msg) {

        text("Enter to unpause", canvas.width / 2, (canvas.height * 2) / 3, 125, "white");
        paused = true;

        pauseStart = performance.now();
      }

      function text(str, x, y, size = 32, color = "white", align = "center") {
        ctx.save();
        ctx.font = `${size}px sans-serif`;
        ctx.fillStyle = color;
        ctx.textAlign = align; // "left", "center" or "right" for x
        ctx.textBaseline = "middle"; // y is the vertical center of the text
        ctx.fillText(str, x, y);
        ctx.restore();
      }

      const rects = [

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      let baseRGB = new Float32Array(0);

      let avgMs = 0;

      canvas.width = 2500;
      canvas.height = 1250;

      const xDegs = 100;
      const yDegs = 50;

      const urlParams = new URLSearchParams(window.location.search);

      const yScale = urlParams.get("yscale") || 0.1;
      const xCells = xDegs / xScale;
      const yCells = yDegs / yScale;

      const rayStep = 0.05;

      let targetRect = null;

      const aMax = Math.tan((xDegs / 2) * (Math.PI / 180));
      const bMax = (aMax * canvas.height) / canvas.width;

      let paused = false;

      function areTouching(a, b) {
        const overlap = (a0, a1, b0, b1) => Math.min(a0, a1) < Math.max(b0, b1) && Math.max(a0, a1) > Math.min(b0, b1);

        return overlap(a[0].x, a[1].x, b[0].x, b[1].x) && overlap(a[0].y, a[1].y, b[0].y, b[1].y) && overlap(a[0].z, a[1].z, b[0].z, b[1].z);
      }

      function checkCollisions(me = playerBox(), arr = rects, returnObj = false) {
        const half = 0.25; // player half-width in x and y

        // when you re-enable the body, replace rects.length with bodyStart
        // so the player doesn't collide with their own body
        const solidCount = arr.length;

        for (let i = 0; i < solidCount; i++) {
          if (areTouching(me, arr[i])) return returnObj ? arr[i] : true;
        }
        return false;
      }

      function playerBox() {
        const half = 0.25;
        return [
          { x: player.x - half, y: player.y - half, z: player.z - feetOffset },
          { x: player.x + half, y: player.y + half, z: player.z + 0.2 },
        ];
      }

      let wantBreak = false;
      let wantPlace = false;
      let avgDeltaTimeForBreaking = 10;

      window.addEventListener("mousedown", (e) => {
        if (document.pointerLockElement !== canvas) return; // the first click only grabs the mouse
        if (e.button === 0) wantBreak = true;
        if (e.button === 2) wantPlace = true;
      });

      let scrollDir = 0; // -1 = up, 1 = down, 0 = none this frame

      window.addEventListener(
        "wheel",
        (e) => {
          if (document.pointerLockElement !== canvas) return; // only while playing
          e.preventDefault(); // stops the page from scrolling
          scrollDir = Math.sign(e.deltaY);
        },
        { passive: false },
      );

      const TREE_RADIUS = 50;

      const TRUNK = { h: 25, s: 50, l: 28 };
      const LEAF = { h: 115, s: 55, l: 32 };

      // [dx, dy, dz, color], relative to the root block
      // Your cross section, rotated around the vertical axis:
      // each layer's arms extend the same distance along x and y.
      const treeOffsets = [
        // trunk
        [0, 0, 0, TRUNK],
        [0, 0, 1, TRUNK],
        // widest layer (the "+++++" row): arms of length 2
        [0, 0, 2, LEAF],
        [1, 0, 2, LEAF],
        [2, 0, 2, LEAF],
        [-1, 0, 2, LEAF],
        [-2, 0, 2, LEAF],
        [0, 1, 2, LEAF],
        [0, 2, 2, LEAF],
        [0, -1, 2, LEAF],
        [0, -2, 2, LEAF],
        [1, 1, 2, LEAF],
        [1, -1, 2, LEAF],
        [-1, 1, 2, LEAF],
        [-1, -1, 2, LEAF],
        // middle layer ("_+++_"): arms of length 1
        [0, 0, 3, LEAF],
        [1, 0, 3, LEAF],
        [-1, 0, 3, LEAF],
        [0, 1, 3, LEAF],
        [0, -1, 3, LEAF],
        // top
        [0, 0, 4, LEAF],
      ];

      function spawnTree(rootX, rootY) {
        rootX = Math.floor(rootX);
        rootY = Math.floor(rootY);

        // root must be within 50 units of the player
        if (Math.hypot(rootX - player.x, rootY - player.y) > TREE_RADIUS) return false;

        const tree = [];
        for (const [dx, dy, dz, color] of treeOffsets) {
          const x = rootX + dx,
            y = rootY + dy,
            z = dz; // root sits on the ground at z = 0
          const r = [{ x, y, z }, { x: x + 1, y: y + 1, z: z + 1 }, { ...color }];
          r[3] = x + 1;
          r[4] = x;
          r[5] = y + 1;
          r[6] = y;
          r[7] = z + 1;
          r[8] = z;
          r[10] = color === TRUNK ? "wood" : "leaf";
          tree.push(r);
        }

        // don't plant a tree on top of the player
        if (tree.some((r) => areTouching(playerBox(), r))) return false;

        rects.push(...tree);
        return true;
      }

      // plant `count` trees at random spots around the player
      function spawnTrees(count) {
        for (let n = 0; n < count; n++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.sqrt(Math.random()) * TREE_RADIUS; // sqrt keeps them evenly spread instead of bunched at the center
          spawnTree(player.x + Math.cos(angle) * dist, player.y + Math.sin(angle) * dist);
          console.log("spawned");
        }
      }

      spawnTrees(Math.floor(Math.random() * 20) + 10);

      const FADE_LEVELS = 64;
      const floorRGB = new Uint8ClampedArray(360 * FADE_LEVELS * 3);
      for (let h = 0; h < 360; h++) {
        for (let f = 0; f < FADE_LEVELS; f++) {
          const [r, g, b] = hslToRgb(h, 60, 30 * (0.25 + 0.75 * (f / (FADE_LEVELS - 1))));
          const o = (h * FADE_LEVELS + f) * 3;
          floorRGB[o] = r;
          floorRGB[o + 1] = g;
          floorRGB[o + 2] = b;
        }
      }

      const colA = new Float32Array(xCells);
      const rowB = new Float32Array(yCells);
      const invLen = new Float32Array(xCells * yCells);
      const dirX = new Float32Array(xCells * yCells);
      const dirY = new Float32Array(xCells * yCells);
      const dirZ = new Float32Array(xCells * yCells);
      const invX = new Float32Array(xCells * yCells);
      const invY = new Float32Array(xCells * yCells);
      const invZ = new Float32Array(xCells * yCells);

      for (let i = 0; i < xCells; i++) colA[i] = (((i + 0.5) / xCells) * 2 - 1) * aMax;
      for (let j = 0; j < yCells; j++) rowB[j] = (1 - ((j + 0.5) / yCells) * 2) * bMax;
      for (let j = 0; j < yCells; j++) for (let i = 0; i < xCells; i++) invLen[j * xCells + i] = 1 / Math.sqrt(1 + colA[i] * colA[i] + rowB[j] * rowB[j]);

      for (const rect of rects) {
        rect[3] = Math.max(rect[0].x, rect[1].x);
        rect[4] = Math.min(rect[0].x, rect[1].x);
        rect[5] = Math.max(rect[0].y, rect[1].y);
        rect[6] = Math.min(rect[0].y, rect[1].y);
        rect[7] = Math.max(rect[0].z, rect[1].z);
        rect[8] = Math.min(rect[0].z, rect[1].z);
      }

      let lastScroll = performance.now();

      let gotInitialBlock = false;
      let initialBlockForBreak = null;
      let breakingStarted = performance.now();
      const breakingTime = 3000;
      let breakingModifier = 1;
      let originalColor = null;

      function updateEnemies(dT = 20) {
        for (let i = 0; i < enemies.length; i++) {
          const obj = enemies[i];
          const oX = obj[0].x + 0.5;
          const oY = obj[0].y + 0.5;
          const oZ = obj[0].z + 1;
          const dX = player.x - oX;
          const dY = player.y - oY;
          const dZ = player.z - oZ;

          const d = Math.hypot(dX, dY);

          const uX = dX / d;
          const uY = dY / d;
          const uZ = dZ / d;

          const step = obj[11].speed * dT * globalEnemySpeedModifier;

          const enemyBox = [
            { x: obj[0].x, y: obj[0].y, z: obj[0].z },
            { x: obj[1].x, y: obj[1].y, z: obj[1].z },
          ];

          console.log(enemyBox);

          obj[0].x += uX * step;
          obj[1].x += uX * step;
          if (
            checkCollisions(
              [
                { x: obj[0].x, y: obj[0].y, z: obj[0].z },
                { x: obj[1].x, y: obj[1].y, z: obj[1].z },
              ],
              rects.concat([...enemies.slice(0, i), ...enemies.slice(i + 1)]),
            )
          ) {
            obj[0].x -= uX * step;
            obj[1].x -= uX * step;
          }
          obj[0].y += uY * step;
          obj[1].y += uY * step;
          if (
            checkCollisions(
              [
                { x: obj[0].x, y: obj[0].y, z: obj[0].z },
                { x: obj[1].x, y: obj[1].y, z: obj[1].z },
              ],
              rects.concat([...enemies.slice(0, i), ...enemies.slice(i + 1)]),
            )
          ) {
            obj[0].y -= uY * step;
            obj[1].y -= uY * step;
          }

          if (obj[11].canFly) {
            obj[0].z += uZ * step;
            obj[1].z += uZ * step;
          } else {
            obj[0].z = Math.max(0, obj[0].z - gravity);
            obj[1].z = Math.max(2, obj[1].z - gravity);
            if (checkCollisions()) {
            }
          }

          obj[3] = Math.max(obj[0].x, obj[1].x);
          obj[4] = Math.min(obj[0].x, obj[1].x);
          obj[5] = Math.max(obj[0].y, obj[1].y);
          obj[6] = Math.min(obj[0].y, obj[1].y);
          obj[7] = Math.max(obj[0].z, obj[1].z);
          obj[8] = Math.min(obj[0].z, obj[1].z);
        }
      }

      function handleInput(dT) {
        const h = (player.xCenterAngle * Math.PI) / 180;
        const fx = Math.cos(h); // forward vector
        const fy = Math.sin(h);
        const pitchLimit = 90 - yDegs / 2;

        const move = movePerMs * dT;

        if (wantPlace) {
          wantPlace = false;
          const selectedBlock = hotbar[hotbarSlot];
          if (selectedBlock) {
            if (selectedBlock.count > 1) {
              const block = placeBlock();
              if (block) {
                hotbar[hotbarSlot].count -= 1;
                if (colorMap[selectedBlock.name]) block[2] = colorMap[selectedBlock.name];
                block[10] = selectedBlock.name;
                rects.push(block);
              }
            } else if (selectedBlock.count === 1) {
              hotbar.splice(hotbarSlot, 1);
              const block = placeBlock();
              if (block) {
                if (colorMap[selectedBlock.name]) block[2] = colorMap[selectedBlock.name];
                block[10] = selectedBlock.name;
                rects.push(block);
              }
            }
          }
        }

        if (wantBreak) {
          if (targetRect) {
            if (!gotInitialBlock) {
              initialBlockForBreak = targetRect;
              originalColor = initialBlockForBreak[2];
              gotInitialBlock = true;
              breakingStarted = performance.now();
              avgDeltaTimeForBreaking = dT;
            }
            const total = breakingTimes[initialBlockForBreak[10]] * breakingModifier;
            const remaining = Math.max(0, total - (performance.now() - breakingStarted)) / total;
            initialBlockForBreak[2] = { ...originalColor, l: originalColor.l * remaining };
            if (performance.now() - breakingStarted > breakingTimes[targetRect[10]] * breakingModifier && targetRect === initialBlockForBreak) {
              gotInitialBlock = false;

              wantBreak = false;
              if (targetRect) {
                const typeOfBlock = targetRect[10] || "wool";
                let addedBlock = false;
                for (const block of hotbar) {
                  if (block.name === typeOfBlock) {
                    block.count += 1;
                    addedBlock = true;
                  }
                }
                if (!addedBlock && hotbar.length < hotbarSize) {
                  hotbar.push({
                    name: typeOfBlock,
                    count: 1,
                  });
                  addedBlock = true;
                }
                if (addedBlock) {
                  const idx = rects.indexOf(targetRect);
                  if (idx !== -1) rects.splice(idx, 1);
                  targetRect = null;
                } else {
                  msg("Not enough hotbar space!");
                }
              }
            }
            if (targetRect !== initialBlockForBreak) {
              initialBlockForBreak[2] = originalColor;
              wantBreak = false;
              gotInitialBlock = false;
            }
          } else if (initialBlockForBreak) {
            initialBlockForBreak[2] = originalColor;
            wantBreak = false;
            gotInitialBlock = false;
          }
        }

        if (scrollDir !== 0 && performance.now() - lastScroll > 50) {
          hotbarSlot = (hotbarSlot + scrollDir + Math.min(hotbarSize, hotbar.length)) % Math.min(hotbarSize, hotbar.length);
          scrollDir = 0;
          lastScroll = performance.now();
        }

        if (keysDown.has("KeyW")) {
          player.x += fx * move;
          if (checkCollisions()) player.x -= fx * move;
          player.y += fy * move;
          if (checkCollisions()) player.y -= fy * move;
        }
        if (keysDown.has("KeyS")) {
          player.x -= fx * move;
          if (checkCollisions()) player.x += fx * move;
          player.y -= fy * move;
          if (checkCollisions()) player.y += fy * move;
        }
        if (keysDown.has("KeyD")) {
          player.x += fy * move;
          if (checkCollisions()) player.x -= fy * move;
          player.y -= fx * move;
          if (checkCollisions()) player.y += fx * move;
        } // right = (fy, -fx)
        if (keysDown.has("KeyA")) {
          player.x -= fy * move;
          if (checkCollisions()) player.x += fy * move;
          player.y += fx * move;
          if (checkCollisions()) player.y -= fx * move;
        }

        if (keysDown.has("Space") && touchingFloor) {
          player.velocity += jumpVelocity;
        }
        //if (keysDown.has("ShiftLeft") || keysDown.has("ShiftRight")) player.z -= move;

        if (keysDown.has("ArrowUp")) {
          player.yCenterAngle = Math.max(-pitchLimit, player.yCenterAngle - moveAngle);
        }
        if (keysDown.has("ArrowDown")) {
          player.yCenterAngle = Math.min(pitchLimit, player.yCenterAngle + moveAngle);
        }
        if (keysDown.has("ArrowLeft")) {
          player.xCenterAngle = (player.xCenterAngle + moveAngle) % 360;
        }
        if (keysDown.has("ArrowRight")) {
          player.xCenterAngle = (player.xCenterAngle - moveAngle + 360) % 360;
        }
      }

      const buf = document.createElement("canvas");
      buf.width = xDegs / xScale;
      buf.height = yDegs / yScale;
      const bufCtx = buf.getContext("2d");
      const img = bufCtx.createImageData(buf.width, buf.height);

      const hitIdx = new Int32Array(xCells * yCells);

      function hslToRgb(h, s, l) {
        s /= 100;
        l /= 100;
        const k = (n) => (n + h / 30) % 12;
        const a = s * Math.min(l, 1 - l);
        const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
        return [f(0) * 255, f(8) * 255, f(4) * 255];
      }

      function setPixel(i, j, h, s, l) {
        const [r, g, b] = hslToRgb(h, s, l);
        const p = (j * buf.width + i) * 4;
        img.data[p] = r;
        img.data[p + 1] = g;
        img.data[p + 2] = b;
        img.data[p + 3] = 255;
      }

      let lastTime = performance.now();

      function loop() {
        if (paused) return;
        const t0 = performance.now();
        const dT = t0 - lastTime;
        lastTime = performance.now();
        handleInput(dT);
        updateVertical(dT);
        placeBlock();
        updateEnemies(dT);

        const renderingArr = rects.concat(enemies);

        //updateBody();

        const th = (player.xCenterAngle * Math.PI) / 180;
        const ph = (player.yCenterAngle * Math.PI) / 180;

        const fwd = { x: Math.cos(th) * Math.cos(ph), y: Math.sin(th) * Math.cos(ph), z: -Math.sin(ph) };
        const right = { x: Math.sin(th), y: -Math.cos(th), z: 0 };
        const up = { x: Math.cos(th) * Math.sin(ph), y: Math.sin(th) * Math.sin(ph), z: Math.cos(ph) };

        for (let j = 0; j < yCells; j++) {
          const b = rowB[j];
          const bx = fwd.x + up.x * b,
            by = fwd.y + up.y * b,
            bz = fwd.z + up.z * b; // row part
          for (let i = 0; i < xCells; i++) {
            const idx = j * xCells + i,
              a = colA[i],
              k = invLen[idx];
            dirX[idx] = (bx + right.x * a) * k;
            dirY[idx] = (by + right.y * a) * k;
            dirZ[idx] = (bz + right.z * a) * k;
            invX[idx] = 1 / dirX[idx];
            invY[idx] = 1 / dirY[idx];
            invZ[idx] = 1 / dirZ[idx];
          }
        }

        img.data.fill(0);

        ts.fill(Infinity);
        hitIdx.fill(-1);

        for (const r of renderingArr) {
          const dx = (r[3] + r[4]) / 2 - player.x,
            dy = (r[5] + r[6]) / 2 - player.y,
            dz = (r[7] + r[8]) / 2 - player.z;
          r[9] = dx * dx + dy * dy + dz * dz;
        }
        renderingArr.sort((a, b) => a[9] - b[9]);

        for (let i = 0; i < xCells; i++) {
          for (let j = 0; j < yCells; j++) {
            const idx = j * xCells + i;
            const uX = dirX[idx],
              uY = dirY[idx],
              uZ = dirZ[idx];
            if (uZ >= 0) continue;
            const ft = -player.z / uZ;
            if (ft >= viewDistance) continue;
            ts[j * xCells + i] = ft;
            const fade = (viewDistance - ft) / viewDistance;
            const hue = tileHue(Math.floor(player.x + uX * ft), Math.floor(player.y + uY * ft));
            const o = (hue * FADE_LEVELS + Math.min(FADE_LEVELS - 1, (fade * FADE_LEVELS) | 0)) * 3;
            const p = idx * 4;
            img.data[p] = floorRGB[o];
            img.data[p + 1] = floorRGB[o + 1];
            img.data[p + 2] = floorRGB[o + 2];
            img.data[p + 3] = 255;
          }
        }

        const near = 0.05;
        const cv = new Float64Array(24); // corner offsets from the player
        const cd = new Float64Array(8); // corner depths along fwd

        for (let r = 0; r < renderingArr.length; r++) {
          const rect = renderingArr[r];
          let minA = Infinity,
            maxA = -Infinity,
            minB = Infinity,
            maxB = -Infinity;

          const addPoint = (vx, vy, vz, depth) => {
            const a = (vx * right.x + vy * right.y + vz * right.z) / depth;
            const b = (vx * up.x + vy * up.y + vz * up.z) / depth;
            if (a < minA) minA = a;
            if (a > maxA) maxA = a;
            if (b < minB) minB = b;
            if (b > maxB) maxB = b;
          };

          // the 8 corners: the 3 bits of c pick min or max on each axis
          for (let c = 0; c < 8; c++) {
            const vx = (c & 1 ? rect[3] : rect[4]) - player.x;
            const vy = (c & 2 ? rect[5] : rect[6]) - player.y;
            const vz = (c & 4 ? rect[7] : rect[8]) - player.z;
            const depth = vx * fwd.x + vy * fwd.y + vz * fwd.z;

            cv[c * 3] = vx;
            cv[c * 3 + 1] = vy;
            cv[c * 3 + 2] = vz;
            cd[c] = depth;

            if (depth > near) addPoint(vx, vy, vz, depth);
          }

          // the 12 edges: each corner paired with the corner that differs in one bit.
          // If one end is in front of the near plane and the other isn't, project the crossing point.
          for (let c = 0; c < 8; c++) {
            for (let bit = 1; bit <= 4; bit <<= 1) {
              if (c & bit) continue; // visit each edge once, from its lower corner
              const d = c | bit;
              if (cd[c] > near !== cd[d] > near) {
                const k = (cd[c] - near) / (cd[c] - cd[d]); // how far along the edge it crosses
                addPoint(
                  cv[c * 3] + (cv[d * 3] - cv[c * 3]) * k,
                  cv[c * 3 + 1] + (cv[d * 3 + 1] - cv[c * 3 + 1]) * k,
                  cv[c * 3 + 2] + (cv[d * 3 + 2] - cv[c * 3 + 2]) * k,
                  near,
                );
              }
            }
          }

          if (minA === Infinity) continue; // nothing in front of you at all

          // a is in [-aMax, aMax]: shift to [0, 2aMax], divide to get 0..1, scale to cells
          let minI = Math.floor(((minA + aMax) / (2 * aMax)) * xCells);
          let maxI = Math.floor(((maxA + aMax) / (2 * aMax)) * xCells);
          // b is flipped (up is positive, rows go down), so max b is the smallest j
          let minJ = Math.floor(((bMax - maxB) / (2 * bMax)) * yCells);
          let maxJ = Math.floor(((bMax - minB) / (2 * bMax)) * yCells);

          if (maxI < 0 || minI >= xCells || maxJ < 0 || minJ >= yCells) continue; // off-screen
          minI = Math.max(0, minI);
          maxI = Math.min(xCells - 1, maxI);
          minJ = Math.max(0, minJ);
          maxJ = Math.min(yCells - 1, maxJ);

          const ndx = Math.max(rect[4] - player.x, 0, player.x - rect[3]);
          const ndy = Math.max(rect[6] - player.y, 0, player.y - rect[5]);
          const ndz = Math.max(rect[8] - player.z, 0, player.z - rect[7]);
          const nearest = Math.hypot(ndx, ndy, ndz);

          for (let j = minJ; j <= maxJ; j++) {
            for (let i = minI; i <= maxI; i++) {
              const idx = j * xCells + i;
              if (ts[idx] <= nearest) continue; // something closer already owns this cell
              const t = findIntersection(rect, dirX[idx], dirY[idx], dirZ[idx], invX[idx], invY[idx], invZ[idx]);
              if (t < ts[idx] && t < viewDistance) {
                ts[idx] = t;
                hitIdx[idx] = r;
              }
            }
          }
        }

        if (baseRGB.length < renderingArr.length * 3) baseRGB = new Float32Array(renderingArr.length * 3 + 300); // grows when needed
        for (let r = 0; r < renderingArr.length; r++) {
          const c = renderingArr[r][2];
          const [rr, gg, bb] = hslToRgb(c.h, c.s, c.l);
          baseRGB[r * 3] = rr;
          baseRGB[r * 3 + 1] = gg;
          baseRGB[r * 3 + 2] = bb;
        }

        for (let idx = 0; idx < hitIdx.length; idx++) {
          const r = hitIdx[idx];
          if (r < 0) continue;
          const rect = renderingArr[r];
          const t = ts[idx];
          let k = 0.25 + 0.75 * ((viewDistance - t) / viewDistance);

          const u = dirX[idx],
            v = dirY[idx],
            w = dirZ[idx];
          const px = player.x + u * t,
            py = player.y + v * t,
            pz = player.z + w * t;
          const eps = Math.min(0.03 + t * 0.002, 0.1);

          let edges = 0;
          if (Math.abs(px - rect[3]) < eps || Math.abs(px - rect[4]) < eps) edges++;
          if (Math.abs(py - rect[5]) < eps || Math.abs(py - rect[6]) < eps) edges++;
          if (Math.abs(pz - rect[7]) < eps || Math.abs(pz - rect[8]) < eps) edges++;
          let rr, gg, bb;
          if (edges >= 2 && rect === targetRect) {
            rr = gg = bb = 242; // the white outline, l = 95 and s = 0
          } else {
            if (edges >= 2) k *= 0.15; // dark outline
            rr = baseRGB[r * 3] * k;
            gg = baseRGB[r * 3 + 1] * k;
            bb = baseRGB[r * 3 + 2] * k;
          }

          const p = idx * 4;
          img.data[p] = rr;
          img.data[p + 1] = gg;
          img.data[p + 2] = bb;
          img.data[p + 3] = 255;
        }

        bufCtx.putImageData(img, 0, 0);
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = false; // keep the blocky look instead of blurring
        ctx.drawImage(buf, 0, 0, canvas.width, canvas.height);
        const frameMs = performance.now() - t0;
        avgMs = avgMs * 0.9 + frameMs * 0.1;
        const stat = JSON.stringify(player) + " MS per Frame: " + Number(avgMs) + " " + health + "   " + dT;

        if (document.getElementById("stats").textContent !== stat) document.getElementById("stats").textContent = stat;
        const cx = canvas.width / 2,
          cy = canvas.height / 2;
        const arm = 12,
          gap = 4,
          thick = 2;

        if (touchingFloor) {
          if (wasInAirLastFrame) {
            const fallDist = lastGroundZ - player.z;
            if (fallDist > fallThreshold) {
              Math.round((health -= damagePerBlock * fallDist));
              lastRegen = performance.now();
            }
          }
          lastGroundZ = player.z;
          wasInAirLastFrame = false;
        } else {
          wasInAirLastFrame = true;
        }

        if (health <= 0) {
          msg("You died!");
          hotbar.length = 0;
          player.x = 0;
          player.y = 0;
          player.z = 1.5;
          player.yCenterAngle = 0;
          player.xCenterAngle = 0;
          player.velocity = 0;
          lastGroundZ = 1.5;
          wasInAirLastFrame = false;
          health = 20;
          lastDamage = performance.now() += 5000 + pauseTime;
        }

        if (health < 20 && performance.now() - lastRegen > regenWait) {
          health += 1;
          lastRegen = performance.now();
        }

        const enemyCollision = checkCollisions(playerBox(), enemies, true);
        if (enemyCollision && performance.now() - lastDamage > 100 * dT) {
          health -= enemyCollision[11].damage;
          lastDamage = performance.now();
          trackMsPerFrame = true;
        }

        health = Math.round(health);

        ctx.globalCompositeOperation = "difference";
        ctx.fillStyle = "white";
        ctx.fillRect(cx - arm, cy - thick / 2, arm - gap, thick); // left
        ctx.fillRect(cx + gap, cy - thick / 2, arm - gap, thick); // right
        ctx.fillRect(cx - thick / 2, cy - arm, thick, arm - gap); // top
        ctx.fillRect(cx - thick / 2, cy + gap, thick, arm - gap); // bottom
        if (hotbar.length > 0 && hotbarSlot < hotbar.length && hotbarSlot >= 0) {
          let name = hotbar[hotbarSlot].name;
          if (!name) name = "WOOL";
          text(name.toUpperCase(), canvas.width / 2, symbolHeightStart, 50);
        }

        ctx.globalCompositeOperation = "source-over";

        let currentHeartX = symbolSpacing;
        for (let h = 0; h < Math.floor(health / 2); h++) {
          drawRect(currentHeartX, symbolHeightStart, symbolWidth, symbolWidth, "black");
          drawRect(
            currentHeartX + symbolOutlineThickness,
            symbolHeightStart + symbolOutlineThickness,
            symbolWidth - symbolOutlineThickness * 2,
            symbolWidth - symbolOutlineThickness * 2,
            "red",
          );
          currentHeartX += symbolWidth + symbolSpacing;
        }
        if (Math.floor(health / 2) !== health / 2) {
          drawRect(currentHeartX, symbolHeightStart, symbolWidth / 2, symbolWidth, "black");
          drawRect(
            currentHeartX + symbolOutlineThickness,
            symbolHeightStart + symbolOutlineThickness,
            symbolWidth / 2 - symbolOutlineThickness * 2,
            symbolWidth - symbolOutlineThickness * 2,
            "red",
          );
        }

        let currentItemX = canvas.width - symbolSpacing - symbolWidth;
        for (let h = hotbar.length - 1; h >= 0; h--) {
          const item = hotbar[h];
          if (hotbarSlot === h) {
            drawRect(currentItemX - symbolSpacing / 2, symbolHeightStart - symbolSpacing / 2, symbolWidth + symbolSpacing, symbolWidth + symbolSpacing, "black");
            drawRect(
              currentItemX + symbolOutlineThickness / 2,
              symbolHeightStart + symbolOutlineThickness / 2,
              symbolWidth - symbolOutlineThickness,
              symbolWidth - symbolOutlineThickness,
              colorMap[item.name] ?
                `hsl(${colorMap[item.name].h}, ${colorMap[item.name].s}%, ${colorMap[item.name].l}%)`
              : `hsl(${(performance.now() / 10) % 360}, 100%, 50%)`,
            );
          } else {
            drawRect(currentItemX, symbolHeightStart, symbolWidth, symbolWidth, "black");
            drawRect(
              currentItemX + symbolOutlineThickness,
              symbolHeightStart + symbolOutlineThickness,
              symbolWidth - symbolOutlineThickness * 2,
              symbolWidth - symbolOutlineThickness * 2,
              colorMap[item.name] ?
                `hsl(${colorMap[item.name].h}, ${colorMap[item.name].s}%, ${colorMap[item.name].l}%)`
              : `hsl(${(performance.now() / 10) % 360}, 100%, 50%)`,
            );
          }
          text(item.count, currentItemX + symbolWidth / 2, symbolHeightStart - symbolSpacing, 32, "white");

          currentItemX -= symbolWidth + symbolSpacing;
        }

        requestAnimationFrame(loop);
      }

      const keysDown = new Set();
      const trackedKeys = new Set(["KeyW", "KeyA", "KeyS", "KeyD", "ShiftLeft", "ShiftRight", "Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"]);

      const movePerMs = 0.01;

      const moveAngle = 1;

      window.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && paused) {
          paused = false;
          pauseTime = performance.now() - pauseStart;
          requestAnimationFrame(loop);
        }
        if (!trackedKeys.has(event.code)) return;

        event.preventDefault(); // Stops arrows/space from scrolling the page
        keysDown.add(event.code);
      });

      window.addEventListener("keyup", (event) => {
        keysDown.delete(event.code);
      });

      const mouseSensitivity = 0.08; // degrees per pixel of mouse movement

      canvas.addEventListener("click", () => {
        canvas.requestPointerLock();
      });

      window.addEventListener("mousemove", (event) => {
        if (document.pointerLockElement !== canvas) return;

        const pitchLimit = 90; // - yDegs / 2; // keep this the same as in handleInput

        // mouse right -> turn right (angle goes down, matching your ArrowRight)
        player.xCenterAngle = (((player.xCenterAngle - event.movementX * mouseSensitivity) % 360) + 360) % 360;

        // mouse down -> look down (positive pitch is down, matching your ArrowDown)
        player.yCenterAngle = Math.max(-pitchLimit, Math.min(pitchLimit, player.yCenterAngle + event.movementY * mouseSensitivity));
      });

      requestAnimationFrame(loop);
    </script>
  </body>
