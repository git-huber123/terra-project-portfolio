      setInterval(() => {
        document.body.style.backgroundColor = cycleBackgroundColor(document.body.style.backgroundColor);

      //I got rid of this function because I realized that I could just keep everything in HSL, simplifying things a LOT. Then I'll just need 2 helper functions, rgbToHsl and getRgbValues, which is why the other 2 are in this archived code block

      function rgbToHsl(r, g, b) {
        r /= 255;
        g /= 255;
        b /= 255;

        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const delta = max - min;

        let h = 0;
        let s = 0;
        const l = (max + min) / 2;

        if (delta !== 0) {
          s = delta / (1 - Math.abs(2 * l - 1));

          if (max === r) h = 60 * (((g - b) / delta) % 6);
          else if (max === g) h = 60 * ((b - r) / delta + 2);
          else h = 60 * ((r - g) / delta + 4);
        }

        h = (h + 360) % 360;
        s *= 100;
        const lightness = l * 100;

        const css = `hsl(${h.toFixed(0)}, ${s.toFixed(0)}%, ${lightness.toFixed(0)}%)`;
        return { h, s, l: lightness, css };
      }

      function getRgbValues(color) {
        const match = color.match(/^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i);

        if (!match) {
          throw new Error(`Invalid RGB color: ${color}`);
        }

        return {
          r: Number(match[1]),
          g: Number(match[2]),
          b: Number(match[3]),
        };
      }

      function cycleBackgroundColor(oldHsl) {
        const nH = rgbToHsl(getRgbValues(oldHsl).r, getRgbValues(oldHsl).g, getRgbValues(oldHsl).b);
        //console.log(nH, oldHsl);
        return `hsl(${(nH.h + 1) % 361}, ${nH.s}%, ${nH.l}%)`;
      }

    <!-- PROJECTS -->
    <!-- This script handles the finished projects and current projects sections -->
    <script>
      const finishedSec = getEl("finished");
      const currentSec = getEl("current");
      // We got the sections, now we have to systematically insert the elements into them. First, let's create the array
      const finishedProjects = [
        {
          name: "Lightsaber",
          description:
            "A club that I'm in designed a lightsaber, and each member made their own version of it, by following along with the mentor. However, I found the solid-color blade boring, and so reprogrammed the Arduino, with the help of ChatGPT, to have a bunch of cool-looking rainbow color modes.",
          subtitle: "Custom-coded to be rainbow!",
        },
        {
          name: "Blender",
          description: "I followed a whole bunch of tutorials and made a lot of cool renders - however, I never made anything original. :(",
          subtitle: "I found it on YT shorts...",
        },
        {
          name: "3D Printing",
          description: "I used Blender - probably not the wisest idea. However, I made a bunch of cool things, and inspired my friend to do it as well.",
          subtitle: "I used a community 3d printer cause I'm broke :(",
        },
        {
          name: "Coding",
          description:
            "I coded a whole bunch of stuff - I made an RPG in python, made a screen time tracker with help from Claude, a website back in '25, and another website back in '26. (2025 and 2026)",
          subtitle: "My first website got taken down cause I didnt pay the bills",
        },
      ];
      const currentProjects = [
        {
          name: "Terra",
          description: "I got an email and now I'm doing it, getting that laptop would be cool.",
          subtitle: "I cannot put in enough hours for that processor bruh",
        },
      ];
      // Now, it's time to actually generate the cards. (I hope these comments will help in the future...)
      for (let i = 0; i < finishedProjects.length; i++) {
        // Create the variables (do these comments make me look like a bot? hope not)
        const project = finishedProjects[i];
        const name = project.name;
        const desc = project.description;
        const subtitle = project.subtitle;

        // Now, we have to get the actual elements created.
        const tileEl = createEl("div");
        const nameEl = createEl("h2");
        const subEl = createEl("h3");
        const descEl = createEl("p");

        nameEl.textContent = name;
        subEl.textContent = subtitle;
        descEl.textContent = desc;

        tileEl.appendChild(nameEl);
        tileEl.appendChild(subEl);
        tileEl.appendChild(descEl);

        tileEl.className = "finishedTile";
        nameEl.className = "finishedName";
        subEl.className = "finishedSub";
        descEl.className = "finishedDesc";

        tileEl.onclick = () => {
          fullscreen(project);
        };

        finishedSec.appendChild(tileEl);
      }

      for (let i = 0; i < currentProjects.length; i++) {
        // Create the variables (do these comments make me look like a bot? hope not)
        const project = currentProjects[i];
        const name = project.name;
        const desc = project.description;
        const subtitle = project.subtitle;

        // Now, we have to get the actual elements created.
        const tileEl = createEl("div");
        const nameEl = createEl("h2");
        const subEl = createEl("h3");
        const descEl = createEl("p");

        nameEl.textContent = name;
        subEl.textContent = subtitle;
        descEl.textContent = desc;

        tileEl.appendChild(nameEl);
        tileEl.appendChild(subEl);
        tileEl.appendChild(descEl);

        tileEl.className = "currentTile";
        nameEl.className = "currentName";
        subEl.className = "currentSub";
        descEl.className = "currentDesc";

        tileEl.onclick = () => {
          fullscreen(project);
        };

        currentSec.appendChild(tileEl);
      }

      function fullscreen(project) {
        const name = project.name;
        const desc = project.description;
        const subtitle = project.subtitle;

        // Now, we have to get the actual elements created.
        const tileEl = createEl("div");
        const nameEl = createEl("h2");
        const subEl = createEl("h3");
        const descEl = createEl("p");

        nameEl.textContent = name;
        subEl.textContent = subtitle;
        descEl.textContent = desc;

        tileEl.appendChild(nameEl);
        tileEl.appendChild(subEl);
        tileEl.appendChild(descEl);

        tileEl.id = "fullscreen-element";

        if (finishedProjects.includes(project)) {
          tileEl.className = "finishedTile";
          nameEl.className = "finishedName";
          subEl.className = "finishedSub";
          descEl.className = "finishedDesc";
        } else {
          tileEl.className = "currentTile";
          nameEl.className = "currentName";
          subEl.className = "currentSub";
          descEl.className = "currentDesc";
        }

        const exit = createEl("div");
        exit.onclick = () => {
          getEl("fullscreen").innerHTML = "";
        };
        exit.id = "fullscreen-exit";
        exit.textContent = "Exit Fullscreen";
        exit.className = "fakeButton";

        tileEl.appendChild(exit);

        getEl("fullscreen").innerHTML = "";
        getEl("fullscreen").appendChild(tileEl);
      }
    </script>

    <!-- TERRA COIN CALC -->
    <!-- This script handles the terra time to coin calculator -->
    <script>
      let totalWeeks = 0;
      function addWeek() {
        if (totalWeeks >= 12) {
          getEl("weeksCounter").style.backgroundColor = "red";
          //getEl("weeksCounter").style.fontWeight = "bold";
          getEl("weeksCounter").style.scale = "1.1";
          setTimeout(() => {
            getEl("weeksCounter").style.backgroundColor = "lightskyblue";
            //getEl("weeksCounter").style.fontWeight = "normal";
            getEl("weeksCounter").style.scale = "1";
          }, 250);
          return;
        }
        let days = [];
        totalWeeks += 1;
        const weekBar = createEl("div");
        weekBar.className = "weekBar";
        const weekId = createEl("h2");
        weekId.textContent = "Week " + totalWeeks;
        weekBar.appendChild(weekId);
        weekId.classList.add("background-filled-week");
        for (const name of "Mon;Tue;Wed;Thu;Fri;Sat;Sun".split(";")) {
          days.push({ name, el: createEl("div"), hours: 0 });
        }
        for (const day of days) {
          const name = createEl("h2");
          name.textContent = day.name;

          const time = createEl("input");
          time.placeholder = 0;
          time.oninput = updateTotalCoins;

          day.el.appendChild(name);
          day.el.appendChild(time);

          weekBar.appendChild(day.el);
          day.el.classList.add("background-filled-week");
          day.el.classList.add("hover-scale");
        }
        const deleteBtn = document.createElement("div");
        deleteBtn.classList.add("fakeButton");
        deleteBtn.textContent = "Remove Week";
        deleteBtn.dataset.weekID = totalWeeks;
        deleteBtn.onclick = () => {
          deleteWeek(deleteBtn.dataset.weekID);
        };

        const duplicateBtn = document.createElement("div");
        duplicateBtn.classList.add("fakeButton");
        duplicateBtn.textContent = "Dupe Week";
        duplicateBtn.dataset.weekID = totalWeeks;
        duplicateBtn.onclick = () => {
          duplicateWeek(duplicateBtn.dataset.weekID);
        };

        const mult = document.createElement("input");
        mult.type = "number";
        mult.min = "0.8";
        mult.max = "1.5";
        mult.step = 0.1;
        mult.oninput = updateTotalCoins;
        mult.placeholder = 1;

        weekBar.appendChild(mult);
        weekBar.appendChild(duplicateBtn);
        weekBar.appendChild(deleteBtn);
        getEl("coincalc").appendChild(weekBar);
        mult.classList.add("background-filled-week");

        getEl("weeksCounter").textContent = totalWeeks + "/12 Weeks";
      }
      function updateTotalCoins() {
        let coins = Number(getEl("currentCoins").value);
        let overallTotalHours = 0;
        for (const week of [...getEl("coincalc").children].slice(1)) {
          let totalHours = 0;
          for (let i = 0; i < 7; i++) {
            totalHours += Number(week.children[i + 1].children[1].value) || 0; // The week's (n + 1)th child is the day, the 1st (0 indexed) child of that is the actual input
          }
          overallTotalHours += totalHours;
          const mult = week.children[8].value || 1;
          if (mult < 0.8) week.children[8].value = 0.8;
          if (mult > 1.5) week.children[8].value = 1.5;
          coins += (totalHours - 10) * 25 * Number(mult) + 20;
          // (totalHours - 10) - The total amount of bonus hours, which is the total hours not counting the first 10
          // * 25 - The net gain from each crop, since they sell for 30 and cost 5
          // * mult - The multiplier on your project, ranges from 0.8 to 1.5, 1.5 would be really good
          // + 20 - The coins you get from the base rent crops, since it's 2 per but you just get them batched at the end after delivering all 10
        }
        getEl("totalCoins").textContent = overallTotalHours / totalWeeks < 10 ? "Not enough hours!" : coins;
      }
      function updateWeekIDs() {
        const p = getEl("coincalc");
        for (let i = 1; i < p.children.length; i++) {
          const w = p.children[i];
          w.children[0].textContent = "Week " + i;
          w.children[9].dataset.weekID = i;
          w.children[10].dataset.weekID = i;

          for (let d = 1; d <= 7; d++) w.children[d].children[1].oninput = updateTotalCoins;
          w.children[8].oninput = updateTotalCoins;
          w.children[9].onclick = () => duplicateWeek(i);
          w.children[10].onclick = () => deleteWeek(i);
        }
      }
      function duplicateWeek(weekID) {
        if (totalWeeks >= 12) {
          getEl("weeksCounter").style.backgroundColor = "red";
          setTimeout(() => (getEl("weeksCounter").style.backgroundColor = "lightskyblue"), 250);
          return;
        }
        const p = getEl("coincalc");
        const oldweek = p.children[weekID];
        oldweek.after(oldweek.cloneNode(true));
        totalWeeks += 1;
        updateWeekIDs();
        getEl("weeksCounter").textContent = totalWeeks + "/12 Weeks";
        updateTotalCoins();
      }
      function deleteWeek(weekID) {
        const p = getEl("coincalc");
        p.children[weekID].remove();
        totalWeeks -= 1;
        updateWeekIDs();
        getEl("weeksCounter").textContent = totalWeeks + "/12 Weeks";
        updateTotalCoins();
      }
    </script>

    <!-- SATISFYING GRID -->
    <!-- This script handles the satisfying region with the hover effects -->
    <script>
      // First things first: procedurally generate the grid. This part isn't too hard, since we just need to append 361 divs (that's 19 squared)
      for (let i = 0; i < 19 * 19; i++) {
        const div = document.createElement("div");
        div.className = "rsdiv";
        getEl("rsgrid").appendChild(div);
        const x = i % 19; // This is which column it's in
        const y = Math.floor(i / 19);
        const hsl = `hsl(${(x + y) * 19}, 75%, 55%)`;
        div.style.backgroundColor = hsl;
        // Just a side note: I'm really proud of this algorithm - sure, it's small, but back in the day something like this would have been a challenge for me to write, but now it's just *snap* and done. (that might be a stretch but still)
      }
    </script>
